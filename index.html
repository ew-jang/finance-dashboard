<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
<style>
:root {
  --bg0: #0b0d14; --bg1: #141720; --bg2: #1c1f2e;
  --bd: #2a2d3e; --tx: #d8dce8; --muted: #6b7280;
  --green: #22c55e; --red: #ef4444;
  --blue: #3b82f6; --orange: #f97316; --purple: #a855f7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
       background: var(--bg0); color: var(--tx); font-size: 14px; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }

header { display: flex; justify-content: space-between; align-items: center;
         padding-bottom: 16px; border-bottom: 1px solid var(--bd); margin-bottom: 20px; }
header h1 { font-size: 22px; font-weight: 700; }
#last-update { color: var(--muted); font-size: 12px; margin-top: 2px; }

.card { background: var(--bg1); border: 1px solid var(--bd); border-radius: 12px; padding: 20px; }
.sec-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; }

.btn { padding: 8px 14px; border-radius: 7px; border: none;
       cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity .15s; }
.btn:hover { opacity: .8; }
.btn-ref  { background: var(--bg2);  color: var(--tx); border: 1px solid var(--bd); }

/* Top grid: overview + F&G */
.top-grid { display: grid; grid-template-columns: 1fr 320px; gap: 16px; margin-bottom: 20px; }
@media(max-width:820px){ .top-grid { grid-template-columns: 1fr; } }

/* Table */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { padding: 9px 13px; color: var(--muted); font-size: 11px; font-weight: 500;
     border-bottom: 1px solid var(--bd); white-space: nowrap; text-align: right; }
th:first-child { text-align: left; }
td { padding: 11px 13px; border-bottom: 1px solid var(--bd); font-size: 13px; white-space: nowrap; text-align: right; }
td:first-child { text-align: left; }
tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--bg2); }
tr.total-row td { border-top: 2px solid var(--bd); font-weight: 700; font-size: 14px; border-bottom: none; }
.acct-link { color: var(--tx); text-decoration: none; font-weight: 600; }
.acct-link:hover { color: var(--blue); }
.acct-sub { font-size: 11px; color: var(--muted); font-weight: 400; }
.gain { color: var(--green); font-weight: 600; }
.loss { color: var(--red); font-weight: 600; }
.share-bar { height: 6px; border-radius: 3px; background: var(--bg0); overflow: hidden; margin-top: 5px; }
.share-bar > span { display:block; height:100%; background: var(--blue); }

/* Toast */
#toast { position: fixed; bottom: 22px; right: 22px; padding: 10px 18px;
         background: var(--bg2); border: 1px solid var(--bd); border-radius: 8px;
         font-size: 13px; opacity: 0; transition: opacity .3s; z-index: 999; pointer-events: none; }
#toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">

<!-- Header -->
<header>
  <div>
    <h1>📈 Portfolio Dashboard</h1>
    <div id="last-update">로딩 중...</div>
  </div>
  <button class="btn btn-ref" onclick="refresh()">↺ 새로고침</button>
</header>

<!-- Accounts -->
<div class="card" style="padding:14px 20px;margin-bottom:16px">
  <div style="font-size:11px;color:var(--muted);margin-bottom:10px;font-weight:500">계좌 바로가기</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <a href="rebal_toss.html" style="display:flex;flex-direction:column;gap:3px;padding:10px 16px;
       background:var(--bg2);border:1px solid var(--bd);border-radius:9px;
       color:var(--tx);text-decoration:none;transition:border-color .15s;min-width:140px"
       onmouseover="this.style.borderColor='var(--blue)'" onmouseout="this.style.borderColor='var(--bd)'">
      <span style="font-size:13px;font-weight:600">🏦 토스증권</span>
      <span style="font-size:11px;color:var(--muted)">S4 전략 · TQQQ·QQQM·USD</span>
    </a>
    <a href="rebal_pension.html" style="display:flex;flex-direction:column;gap:3px;padding:10px 16px;
       background:var(--bg2);border:1px solid var(--bd);border-radius:9px;
       color:var(--tx);text-decoration:none;transition:border-color .15s;min-width:140px"
       onmouseover="this.style.borderColor='var(--green)'" onmouseout="this.style.borderColor='var(--bd)'">
      <span style="font-size:13px;font-weight:600">🏦 개인연금</span>
      <span style="font-size:11px;color:var(--muted)">자산배분 · S&amp;P500·미국TOP10</span>
    </a>
    <a href="kiwoom.html?acct=kr" style="display:flex;flex-direction:column;gap:3px;padding:10px 16px;
       background:var(--bg2);border:1px solid var(--bd);border-radius:9px;
       color:var(--tx);text-decoration:none;transition:border-color .15s;min-width:140px"
       onmouseover="this.style.borderColor='var(--blue)'" onmouseout="this.style.borderColor='var(--bd)'">
      <span style="font-size:13px;font-weight:600">🏦 키움 국내</span>
      <span style="font-size:11px;color:var(--muted)">수익률 추적 · 국내·KRW</span>
    </a>
    <a href="kiwoom.html?acct=us" style="display:flex;flex-direction:column;gap:3px;padding:10px 16px;
       background:var(--bg2);border:1px solid var(--bd);border-radius:9px;
       color:var(--tx);text-decoration:none;transition:border-color .15s;min-width:140px"
       onmouseover="this.style.borderColor='var(--blue)'" onmouseout="this.style.borderColor='var(--bd)'">
      <span style="font-size:13px;font-weight:600">🏦 키움 해외</span>
      <span style="font-size:11px;color:var(--muted)">수익률 추적 · 미국·USD</span>
    </a>
    <!-- 계좌 추가 시 여기에 카드 추가 -->
  </div>
</div>

<!-- Overview + F&G -->
<div class="top-grid">
  <div class="card">
    <div class="sec-title">💰 전체 계좌 현황 <span id="grand-total" style="font-size:13px;color:var(--green);font-weight:700;float:right"></span></div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>계좌</th><th>평가금액</th><th>비중</th><th>평가손익 (수익률)</th>
        </tr></thead>
        <tbody id="ov-body">
          <tr><td colspan="4" style="text-align:center;color:var(--muted);padding:20px">로딩 중...</td></tr>
        </tbody>
      </table>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:10px">
      ※ 실시간 시세로 환산한 평가액 (USD 계좌는 환율 적용). 손익은 매입단가가 있는 키움 계좌만 표시.
    </div>
  </div>

  <div class="card">
    <div class="sec-title">CNN Fear &amp; Greed Index</div>
    <div id="fg-gauge" style="height:240px"></div>
  </div>
</div>

</div><!-- /wrap -->
<div id="toast"></div>

<script>
const BASE = 'https://ew-jang.github.io/finance-dashboard/';

// 계좌 정의 — 새 계좌 추가 시 여기에 한 줄
const ACCOUNTS = [
  { name:'토스증권',  sub:'S4 전략',      href:'rebal_toss.html',       file:'pf_snaps_toss.json',     type:'toss' },
  { name:'개인연금',  sub:'자산배분',      href:'rebal_pension.html',    file:'pf_snaps_pension.json',  type:'pension' },
  { name:'키움 국내', sub:'국내·KRW',     href:'kiwoom.html?acct=kr',   file:'pf_snaps_kiwoomkr.json', type:'kiwoom', cur:'KRW' },
  { name:'키움 해외', sub:'미국·USD',     href:'kiwoom.html?acct=us',   file:'pf_snaps_kiwoomus.json', type:'kiwoom', cur:'USD' },
];

// ── Fetch helpers ─────────────────────────────────────────────────────────────
async function apiFetch(url) {
  try { const r = await fetch(url); if (!r.ok) throw 0; return await r.json(); }
  catch { const r = await fetch('https://corsproxy.io/?' + encodeURIComponent(url)); if (!r.ok) throw new Error('fail'); return await r.json(); }
}
async function fetchPrice(ticker) {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=5d`;
  try { const d = await apiFetch(url); const m = d.chart.result[0].meta; return m.regularMarketPrice ?? null; }
  catch { return null; }
}
async function fetchFG() {
  try { const d = await apiFetch('https://production.dataviz.cnn.io/index/fearandgreed/graphdata');
    return { score: Math.round(d.fear_and_greed.score), rating: d.fear_and_greed.rating }; }
  catch { try { const d = await apiFetch('https://api.alternative.me/fng/?limit=1'); const v=d.data[0];
      return { score:+v.value, rating:v.value_classification }; } catch { return { score:null, rating:null }; } }
}

// ── F&G gauge ─────────────────────────────────────────────────────────────────
function fgColor(s){ return s<25?'#ef4444':s<45?'#f97316':s<55?'#eab308':s<75?'#22c55e':'#10b981'; }
function fgLabel(s){ return s<25?'Extreme Fear 😨':s<45?'Fear 😟':s<55?'Neutral 😐':s<75?'Greed 😊':'Extreme Greed 🤑'; }
function renderFG(fg){
  const el=document.getElementById('fg-gauge');
  if(!fg.score){ el.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted)">데이터를 불러올 수 없습니다</div>'; return; }
  const s=fg.score, c=fgColor(s);
  Plotly.newPlot(el,[{ type:'indicator', mode:'gauge+number', value:s,
    title:{text:fgLabel(s),font:{size:15,color:'#d8dce8'}}, number:{font:{size:42,color:c}},
    gauge:{ axis:{range:[0,100],tickwidth:1,tickcolor:'#6b7280',tickvals:[0,25,45,55,75,100]},
      bar:{color:c,thickness:0.25}, bgcolor:'transparent',
      steps:[{range:[0,25],color:'rgba(239,68,68,0.13)'},{range:[25,45],color:'rgba(249,115,22,0.11)'},
        {range:[45,55],color:'rgba(234,179,8,0.11)'},{range:[55,75],color:'rgba(34,197,94,0.11)'},
        {range:[75,100],color:'rgba(16,185,129,0.14)'}],
      threshold:{line:{color:'#fff',width:3},thickness:0.78,value:s} } }],
    { paper_bgcolor:'transparent',plot_bgcolor:'transparent',margin:{t:40,b:0,l:20,r:20},height:240,font:{color:'#d8dce8'} },
    {responsive:true,displayModeBar:false});
}

// ── Account overview ──────────────────────────────────────────────────────────
const fmtKrw = n => '₩' + Math.round(n).toLocaleString('ko-KR');
const fmtMan  = n => '₩' + Math.round(n/10000).toLocaleString('ko-KR') + '만';

async function buildOverview() {
  const files = await Promise.all(ACCOUNTS.map(a =>
    fetch(BASE + a.file + '?t=' + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null)));

  // 필요한 티커 수집
  const need = new Set();
  ACCOUNTS.forEach((a, i) => {
    const d = files[i]; if (!d) return;
    if (a.type === 'toss')    { need.add('TQQQ'); need.add('QQQM'); need.add('USDKRW=X'); }
    else if (a.type === 'pension') { need.add('379800.KS'); need.add('381170.KS'); }
    else if (a.type === 'kiwoom')  { (d.holdings||[]).forEach(h => need.add(h.ticker)); if (a.cur==='USD') need.add('USDKRW=X'); }
  });
  const prices = {};
  await Promise.all([...need].map(t => fetchPrice(t).then(p => { if (p!=null) prices[t]=p; })));
  const usdkrw = prices['USDKRW=X'] ?? null;

  // 계좌별 평가액(KRW) + 매입원가(있으면) + 현금(있으면)
  return ACCOUNTS.map((a, i) => {
    const d = files[i]; let krw = null, cost = null, cashKrw = null;
    if (d) {
      if (a.type === 'toss') {
        const s = d[d.length-1];
        if (s && prices['TQQQ'] && prices['QQQM'] && usdkrw) {
          krw = (s.tqqq*prices['TQQQ'] + s.qqqm*prices['QQQM'] + s.usd) * usdkrw;
          if (s.costKrw != null) cost = s.costKrw;
          if (s.usd) cashKrw = s.usd * usdkrw;
        }
      } else if (a.type === 'pension') {
        const s = d[d.length-1];
        if (s && prices['379800.KS'] && prices['381170.KS']) {
          krw = s.sp500*prices['379800.KS'] + s.tech10*prices['381170.KS'];
          if (s.sp500AvgCost != null && s.tech10AvgCost != null)
            cost = s.sp500*s.sp500AvgCost + s.tech10*s.tech10AvgCost;
        }
      } else if (a.type === 'kiwoom') {
        let v=0, c=0, ok=true;
        (d.holdings||[]).forEach(h => { const px=prices[h.ticker]; if(px==null) ok=false; else v+=h.qty*px; c+=h.qty*h.avgCost; });
        if (ok) {
          const fx = a.cur==='USD' ? (usdkrw||0) : 1;
          const cashAmt = d.cash || 0;
          krw = (v + cashAmt) * fx;
          cost = (c + cashAmt) * fx;
          if (cashAmt) cashKrw = cashAmt * fx;
        }
      }
    }
    return { ...a, krw, cost, cashKrw };
  });
}

function renderOverview(rows) {
  const total = rows.reduce((s,r) => s + (r.krw||0), 0);
  document.getElementById('grand-total').textContent = '합계 ' + fmtMan(total);

  document.getElementById('ov-body').innerHTML = rows.map(r => {
    if (r.krw == null)
      return `<tr><td><a class="acct-link" href="${r.href}">🏦 ${r.name}</a><div class="acct-sub">${r.sub}</div></td>
              <td colspan="3" style="color:var(--muted)">시세 조회 실패</td></tr>`;
    const pct = total ? (r.krw/total*100) : 0;
    let pnl = '';
    if (r.cost != null) {
      const diff = r.krw - r.cost, ret = r.cost ? diff/r.cost*100 : 0;
      const cls = diff>=0?'gain':'loss', sg = diff>=0?'+':'';
      pnl = `<span class="${cls}">${sg}${fmtMan(diff)} <span style="font-weight:400">(${sg}${ret.toFixed(1)}%)</span></span>`;
    } else pnl = '<span style="color:var(--muted)">—</span>';
    return `<tr>
      <td><a class="acct-link" href="${r.href}">🏦 ${r.name}</a><div class="acct-sub">${r.sub}</div></td>
      <td><b>${fmtMan(r.krw)}</b>${r.cashKrw ? `<div class="acct-sub">현금 ${fmtMan(r.cashKrw)}</div>` : ''}</td>
      <td>${pct.toFixed(1)}%<div class="share-bar"><span style="width:${pct}%"></span></div></td>
      <td>${pnl}</td>
    </tr>`;
  }).join('') +
    `<tr class="total-row"><td>전체 합계</td><td>${fmtMan(total)}</td><td>100%</td><td></td></tr>`;
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let _tid;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(_tid); _tid=setTimeout(()=>el.classList.remove('show'),2500); }

// ── Refresh ───────────────────────────────────────────────────────────────────
async function refresh() {
  document.getElementById('last-update').textContent = '데이터 로딩 중...';
  const [fg, ov] = await Promise.all([ fetchFG(), buildOverview() ]);
  renderFG(fg);
  renderOverview(ov);
  document.getElementById('last-update').textContent =
    `마지막 업데이트: ${new Date().toLocaleString('ko-KR')}  ·  매 1시간 자동 갱신`;
}

setInterval(refresh, 60 * 60 * 1000);
refresh();
</script>
</body>
</html>
