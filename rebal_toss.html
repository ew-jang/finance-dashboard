<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리밸런싱 | 토스증권</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
<style>
:root {
  --bg0:#0b0d14; --bg1:#141720; --bg2:#1c1f2e;
  --bd:#2a2d3e; --tx:#d8dce8; --muted:#6b7280;
  --green:#22c55e; --red:#ef4444; --blue:#3b82f6;
  --orange:#f97316; --purple:#a855f7;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       background:var(--bg0); color:var(--tx); font-size:14px; }
.wrap { max-width:900px; margin:0 auto; padding:20px; }

header { display:flex; justify-content:space-between; align-items:center;
         padding-bottom:16px; border-bottom:1px solid var(--bd); margin-bottom:20px; }
header h1 { font-size:20px; font-weight:700; }
#last-update { color:var(--muted); font-size:12px; margin-top:2px; }

.back-btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px;
            background:var(--bg2); border:1px solid var(--bd); border-radius:7px;
            color:var(--tx); font-size:13px; font-weight:500; text-decoration:none;
            cursor:pointer; transition:opacity .15s; }
.back-btn:hover { opacity:.8; }

.card { background:var(--bg1); border:1px solid var(--bd); border-radius:12px; padding:20px; margin-bottom:20px; }
.sec-title { font-size:15px; font-weight:600; margin-bottom:14px; }
label.lbl { font-size:11px; color:var(--muted); display:block; margin-bottom:4px; }

.btn { padding:8px 14px; border-radius:7px; border:none;
       cursor:pointer; font-size:13px; font-weight:500; width:100%; transition:opacity .15s; }
.btn:hover { opacity:.8; }
.btn-add { background:var(--blue); color:#fff; }
.btn-ref { background:var(--bg2); color:var(--tx); border:1px solid var(--bd); }

input[type=date], input[type=number] {
  width:100%; padding:8px 10px;
  background:var(--bg0); border:1px solid var(--bd); border-radius:7px;
  color:var(--tx); font-size:13px;
}
input[type=date]:focus, input[type=number]:focus { outline:none; border-color:var(--blue); }
input[type=date]::-webkit-calendar-picker-indicator { filter:invert(.55) brightness(1.2); cursor:pointer; }

.tracker-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:18px; }
@media(max-width:680px){ .tracker-grid { grid-template-columns:1fr; } }

.rec-card { flex:1; min-width:78px; padding:10px; border-radius:8px;
            background:var(--bg2); text-align:center; }
.rec-card .rc-label { font-size:10px; margin-bottom:3px; }
.rec-card .rc-val   { font-size:22px; font-weight:700; line-height:1.2; }
.rec-card .rc-sub   { font-size:10px; color:var(--muted); margin-top:1px; }

.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th { padding:9px 13px; color:var(--muted); font-size:11px; font-weight:500;
     border-bottom:1px solid var(--bd); white-space:nowrap; text-align:left; }
td { padding:9px 13px; border-bottom:1px solid var(--bd); font-size:13px; white-space:nowrap; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:var(--bg2); }
#snap-list th, #snap-list td:not(:first-child) { text-align:right; }
.pos { color:var(--green); font-weight:600; }

#toast { position:fixed; bottom:22px; right:22px; padding:10px 18px;
         background:var(--bg2); border:1px solid var(--bd); border-radius:8px;
         font-size:13px; opacity:0; transition:opacity .3s; z-index:999; pointer-events:none; }
#toast.show { opacity:1; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>🏦 토스증권 리밸런싱</h1>
    <div id="last-update">로딩 중...</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn btn-ref" style="width:auto" onclick="refresh()">↺ 새로고침</button>
    <a class="back-btn" href="index.html">← 대시보드</a>
  </div>
</header>

<div class="card">
  <div class="tracker-grid">
    <!-- Left: regime + recommendation + current holdings -->
    <div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px">현재 시장 레짐</div>
      <div id="rebal-regime-badge">—</div>

      <div style="font-size:11px;color:var(--muted);margin-top:14px;margin-bottom:6px">권장 구성 기준 금액</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <input type="number" id="rebal-krw" value="17000000" oninput="updateRebalRec()" style="width:148px">
        <span style="color:var(--muted);font-size:12px">원</span>
      </div>
      <div id="rebal-rec">—</div>
      <div id="rebal-prices" style="font-size:11px;color:var(--muted);margin-top:8px"></div>
      <div id="current-holdings"></div>
    </div>

    <!-- Right: snapshot input -->
    <div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px">보유 현황 입력 <span style="font-size:10px">(날짜별 저장 · 같은 날짜는 덮어씀)</span></div>
      <div style="display:grid;gap:8px">
        <div>
          <label class="lbl">날짜</label>
          <input type="date" id="snap-date">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
          <div>
            <label class="lbl">TQQQ (주)</label>
            <input type="number" id="snap-tqqq" placeholder="0" min="0">
          </div>
          <div>
            <label class="lbl">QQQM (주)</label>
            <input type="number" id="snap-qqqm" placeholder="0" min="0">
          </div>
          <div>
            <label class="lbl">USD ($)</label>
            <input type="number" id="snap-usd" placeholder="0" min="0">
          </div>
        </div>
        <button class="btn btn-add" onclick="saveSnapshot()">📌 저장</button>
        <div id="snap-status" style="font-size:12px;min-height:18px"></div>
      </div>
    </div>
  </div>

  <!-- Regime comparison table -->
  <div id="rebal-table"></div>

  <!-- Wealth chart -->
  <div id="wealth-chart"></div>

  <!-- Entry list -->
  <div id="snap-list"></div>

  <!-- iCloud sync -->
  <div style="display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--bd);flex-wrap:wrap">
    <span style="font-size:12px;color:var(--muted)">☁️ iCloud Drive</span>
    <span id="icloud-status" style="font-size:12px"></span>
    <button id="icloud-connect-btn" class="btn btn-ref"
            style="display:none;width:auto;padding:6px 12px;font-size:12px"
            onclick="connectICloud()">폴더 연결 (Mac 최초 1회)</button>
  </div>
</div>

</div><!-- /wrap -->
<div id="toast"></div>

<script>
const CORS_PROXY = 'https://corsproxy.io/?';
const SNAPS_URL  = 'https://ew-jang.github.io/finance-dashboard/pf_snaps_toss.json';

const REBAL = [
  { label:'🔴 하락장',   desc:'200MA 아래', color:'#ef4444', tqqq:  0, qqqm:20, usd:80 },
  { label:'🟡 공포 구간', desc:'VIX ≥ 30',  color:'#eab308', tqqq: 15, qqqm:35, usd:50 },
  { label:'🟠 중립 구간', desc:'VIX 20–30', color:'#f97316', tqqq: 40, qqqm:35, usd:25 },
  { label:'🟢 황금 구간', desc:'VIX < 20',  color:'#22c55e', tqqq: 65, qqqm:25, usd:10 },
];
let _rd = null;

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg, ms=2800) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), ms);
}

// ── Persistence ───────────────────────────────────────────────────────────────
function loadSnaps() {
  try { const s=localStorage.getItem('pf_snaps_toss'); if(s) return JSON.parse(s); } catch {}
  return [];
}
function saveSnaps(arr) { try { localStorage.setItem('pf_snaps_toss', JSON.stringify(arr)); } catch {} }

// ── GitHub sync ───────────────────────────────────────────────────────────────
async function syncSnapsFromGitHub() {
  try {
    const res = await fetch(SNAPS_URL + '?t=' + Date.now());
    if (!res.ok) return;
    const remote = await res.json();
    if (!Array.isArray(remote) || !remote.length) return;
    const merged = loadSnaps();
    remote.forEach(entry => {
      const i = merged.findIndex(s => s.date === entry.date);
      if (i >= 0) merged[i] = entry; else merged.push(entry);
    });
    merged.sort((a, b) => a.date.localeCompare(b.date));
    saveSnaps(merged);
    renderWealthChart();
    renderSnapList();
  } catch {}
}

// ── API ───────────────────────────────────────────────────────────────────────
async function apiFetch(url) {
  try { return await (await fetch(url)).json(); } catch {}
  return (await fetch(CORS_PROXY + encodeURIComponent(url))).json();
}

async function fetchCloses(ticker, range='1y') {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=${range}`;
  try {
    const d = await apiFetch(url);
    return d.chart.result[0].indicators.quote[0].close.filter(c => c != null);
  } catch { return []; }
}

async function fetchPriceOnDate(ticker, dateStr) {
  const p1 = Math.floor(new Date(dateStr+'T10:00:00Z').getTime()/1000);
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?period1=${p1}&period2=${p1+7*86400}&interval=1d`;
  try {
    const d = await apiFetch(url);
    return d.chart.result[0].indicators.quote[0].close.find(c => c!=null) ?? null;
  } catch { return null; }
}

function calcMA(arr, n) {
  if (arr.length < n) return null;
  return arr.slice(-n).reduce((a, b) => a + b, 0) / n;
}

// ── Rebalancing ───────────────────────────────────────────────────────────────
function initRebal(tqqqPx, qqqmPx, usdkrw, qqqmCloses, vixVal) {
  if (!tqqqPx || !qqqmPx || !usdkrw || !qqqmCloses?.length || !vixVal) return;
  const ma200 = calcMA(qqqmCloses, 200);
  const last  = qqqmCloses.at(-1);
  let regime;
  if (!ma200 || last < ma200) regime = 0;
  else if (vixVal >= 30)      regime = 1;
  else if (vixVal >= 20)      regime = 2;
  else                        regime = 3;
  _rd = { tqqqPx, qqqmPx, usdkrw, regime, ma200, last, vixVal };

  const el = document.getElementById('snap-date');
  if (!el.value) el.value = new Date().toISOString().slice(0,10);
  try { const k=localStorage.getItem('rebal_krw_toss'); if(k) document.getElementById('rebal-krw').value=k; } catch {}

  updateRebalRec();
  renderWealthChart();
  renderSnapList();
}

function updateRebalRec() {
  if (!_rd) return;
  const { tqqqPx, qqqmPx, usdkrw, regime, ma200, last, vixVal } = _rd;
  const krw = parseFloat(document.getElementById('rebal-krw').value) || 17_000_000;
  try { localStorage.setItem('rebal_krw_toss', krw); } catch {}
  const usd = krw / usdkrw;
  const a   = REBAL[regime];

  document.getElementById('rebal-regime-badge').innerHTML =
    `<div style="display:inline-flex;align-items:center;gap:10px;padding:8px 16px;
                 border-radius:9px;border:1px solid ${a.color};background:${a.color}18;margin-bottom:8px">
       <span style="font-size:17px;font-weight:700;color:${a.color}">${a.label}</span>
       <span style="font-size:11px;color:var(--muted)">${a.desc}</span>
     </div>
     <div style="font-size:11px;color:var(--muted)">
       QQQM $${last.toFixed(2)} / 200MA $${ma200.toFixed(2)} &nbsp;·&nbsp; VIX ${vixVal.toFixed(1)}
     </div>`;

  const tSh = Math.floor(usd * a.tqqq / 100 / tqqqPx);
  const qSh = Math.floor(usd * a.qqqm / 100 / qqqmPx);
  const uAmt = usd * a.usd / 100;

  document.getElementById('rebal-rec').innerHTML =
    `<div style="font-size:11px;color:var(--muted);margin-bottom:6px">
       권장 구성 — 총 $${Math.round(usd).toLocaleString()} (₩${Math.round(krw/10000).toLocaleString()}만)
     </div>
     <div style="display:flex;gap:8px;flex-wrap:wrap">
       <div class="rec-card" style="border-left:3px solid #f97316">
         <div class="rc-label" style="color:#f97316">TQQQ ${a.tqqq}%</div>
         <div class="rc-val">${tSh}<span style="font-size:12px;font-weight:400;color:var(--muted)">주</span></div>
         <div class="rc-sub">≈$${(tSh*tqqqPx).toFixed(0)}</div>
       </div>
       <div class="rec-card" style="border-left:3px solid #a855f7">
         <div class="rc-label" style="color:#a855f7">QQQM ${a.qqqm}%</div>
         <div class="rc-val">${qSh}<span style="font-size:12px;font-weight:400;color:var(--muted)">주</span></div>
         <div class="rc-sub">≈$${(qSh*qqqmPx).toFixed(0)}</div>
       </div>
       <div class="rec-card" style="border-left:3px solid #3b82f6">
         <div class="rc-label" style="color:#3b82f6">USD ${a.usd}%</div>
         <div class="rc-val" style="font-size:16px">$${Math.round(uAmt).toLocaleString()}</div>
         <div class="rc-sub">₩${Math.round(uAmt*usdkrw/10000)}만</div>
       </div>
     </div>`;

  document.getElementById('rebal-prices').innerHTML =
    `TQQQ $${tqqqPx.toFixed(2)} &nbsp;·&nbsp; QQQM $${qqqmPx.toFixed(2)} &nbsp;·&nbsp; 1$ = ${usdkrw.toFixed(1)}원`;

  // 현재 구성
  const snaps = loadSnaps();
  const el2 = document.getElementById('current-holdings');
  if (snaps.length && el2) {
    const s = snaps[snaps.length - 1];
    const curUsd = s.tqqq*tqqqPx + s.qqqm*qqqmPx + s.usd;
    const curKrw = curUsd * usdkrw;
    const dT = s.tqqq-tSh, dQ = s.qqqm-qSh, dU = s.usd-uAmt;
    const delta = (n, unit) => {
      if (Math.abs(n) < 0.5) return '';
      const sign = n > 0 ? '+' : '';
      const col  = n > 0 ? '#22c55e' : '#ef4444';
      return `<span style="font-size:10px;color:${col};margin-left:3px">(권장 대비 ${sign}${Math.round(n)}${unit})</span>`;
    };
    el2.innerHTML =
      `<div style="font-size:11px;color:var(--muted);margin-top:16px;margin-bottom:6px">
         현재 구성 <span style="opacity:.6">${s.date} 입력 · 현재 시세 평가</span>
       </div>
       <div style="display:flex;gap:8px;flex-wrap:wrap">
         <div class="rec-card" style="border-left:3px solid #f97316">
           <div class="rc-label" style="color:#f97316">TQQQ</div>
           <div class="rc-val">${s.tqqq}<span style="font-size:12px;font-weight:400;color:var(--muted)">주</span></div>
           <div class="rc-sub">$${(s.tqqq*tqqqPx).toFixed(0)} ${delta(dT,'주')}</div>
         </div>
         <div class="rec-card" style="border-left:3px solid #a855f7">
           <div class="rc-label" style="color:#a855f7">QQQM</div>
           <div class="rc-val">${s.qqqm}<span style="font-size:12px;font-weight:400;color:var(--muted)">주</span></div>
           <div class="rc-sub">$${(s.qqqm*qqqmPx).toFixed(0)} ${delta(dQ,'주')}</div>
         </div>
         <div class="rec-card" style="border-left:3px solid #3b82f6">
           <div class="rc-label" style="color:#3b82f6">USD</div>
           <div class="rc-val" style="font-size:16px">$${Math.round(s.usd).toLocaleString()}</div>
           <div class="rc-sub">₩${Math.round(s.usd*usdkrw/10000)}만 ${delta(dU,'$')}</div>
         </div>
       </div>
       <div style="font-size:12px;color:var(--tx);margin-top:8px;font-weight:600">
         현재 평가액 &nbsp;$${Math.round(curUsd).toLocaleString()}
         &nbsp;<span style="color:var(--green)">₩${Math.round(curKrw/10000).toLocaleString()}만</span>
       </div>`;
  } else if (el2) {
    el2.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-top:12px">보유 현황 저장 후 현재가 평가액이 표시됩니다</div>';
  }

  renderRebalTable();
}

function renderRebalTable() {
  if (!_rd) return;
  const { tqqqPx, qqqmPx, usdkrw, regime } = _rd;
  const krw = parseFloat(document.getElementById('rebal-krw').value) || 17_000_000;
  const usd = krw / usdkrw;
  const snaps = loadSnaps();
  const cur = snaps.length ? snaps[snaps.length - 1] : null;
  const curUsd = cur ? cur.tqqq*tqqqPx + cur.qqqm*qqqmPx + cur.usd : null;

  const rows = REBAL.map((a, i) => {
    const tSh  = Math.floor(usd * a.tqqq / 100 / tqqqPx);
    const qSh  = Math.floor(usd * a.qqqm / 100 / qqqmPx);
    const uAmt = Math.round(usd * a.usd  / 100);
    return { a, i, tSh, qSh, uAmt };
  });
  const active = rows[regime];

  const diff = (n, unit) => {
    if (Math.abs(n) < 0.5) return '';
    const col = n > 0 ? '#22c55e' : '#ef4444';
    return `<span style="font-size:10px;color:${col}"> (${n>0?'+':''}${Math.round(n)}${unit})</span>`;
  };

  let trs = rows.map(({ a, i, tSh, qSh, uAmt }) => {
    const isActive = i === regime;
    const bg   = isActive ? `style="background:${a.color}14"` : '';
    const mark = isActive
      ? `<span style="font-size:9px;background:${a.color};color:#000;padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:middle;font-weight:700">현재</span>`
      : '';
    return `<tr ${bg}>
      <td style="color:${a.color};font-weight:${isActive?700:400}">${a.label}${mark}
        <span style="font-size:10px;color:var(--muted);font-weight:400;margin-left:4px">${a.desc}</span></td>
      <td style="font-weight:${isActive?700:400}">${tSh}주</td>
      <td style="color:var(--muted);font-size:12px">$${(tSh*tqqqPx).toFixed(0)}</td>
      <td style="font-weight:${isActive?700:400}">${qSh}주</td>
      <td style="color:var(--muted);font-size:12px">$${(qSh*qqqmPx).toFixed(0)}</td>
      <td style="font-weight:${isActive?700:400}">$${uAmt.toLocaleString()}</td>
    </tr>`;
  }).join('');

  if (cur) {
    const dT = cur.tqqq - active.tSh;
    const dQ = cur.qqqm - active.qSh;
    const dU = cur.usd  - active.uAmt;
    trs += `<tr style="border-top:2px solid var(--bd)">
      <td style="font-weight:700">현재 보유
        <span style="font-size:10px;color:var(--muted);font-weight:400"> ${cur.date}</span></td>
      <td style="font-weight:700">${cur.tqqq}주${diff(dT,'주')}</td>
      <td style="color:var(--muted);font-size:12px">$${(cur.tqqq*tqqqPx).toFixed(0)}</td>
      <td style="font-weight:700">${cur.qqqm}주${diff(dQ,'주')}</td>
      <td style="color:var(--muted);font-size:12px">$${(cur.qqqm*qqqmPx).toFixed(0)}</td>
      <td style="font-weight:700">$${Math.round(cur.usd).toLocaleString()}${diff(dU,'$')}</td>
    </tr>
    <tr>
      <td colspan="6" style="font-size:12px;color:var(--muted)">
        현재 평가액
        <b style="color:var(--green)">$${Math.round(curUsd).toLocaleString()}</b>
        <span style="color:var(--tx)"> (₩${Math.round(curUsd*usdkrw/10000).toLocaleString()}만)</span>
        &nbsp;·&nbsp; 권장 대비 현재 레짐 기준으로 표시
      </td>
    </tr>`;
  }

  document.getElementById('rebal-table').innerHTML =
    `<div style="margin:16px 0 8px;font-size:11px;color:var(--muted)">
       레짐별 권장 구성 비교
       <span style="opacity:.7"> — 기준 $${Math.round(usd).toLocaleString()} (₩${Math.round(krw/10000).toLocaleString()}만)</span>
     </div>
     <div class="tbl-wrap"><table>
       <thead><tr>
         <th>레짐</th>
         <th style="color:#f97316">TQQQ</th><th style="color:#f97316;font-weight:400">평가</th>
         <th style="color:#a855f7">QQQM</th><th style="color:#a855f7;font-weight:400">평가</th>
         <th style="color:#3b82f6">USD</th>
       </tr></thead>
       <tbody>${trs}</tbody>
     </table></div>`;
}

// ── Snapshot ──────────────────────────────────────────────────────────────────
function downloadSnaps(snaps) {
  const blob = new Blob([JSON.stringify(snaps,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download='pf_snaps_toss.json'; a.click();
}

async function saveSnapshot() {
  const date = document.getElementById('snap-date').value;
  const tqqq = parseFloat(document.getElementById('snap-tqqq').value) || 0;
  const qqqm = parseFloat(document.getElementById('snap-qqqm').value) || 0;
  const usd  = parseFloat(document.getElementById('snap-usd').value)  || 0;
  const stat = document.getElementById('snap-status');

  if (!date) { stat.innerHTML='<span style="color:var(--red)">날짜를 입력하세요</span>'; return; }
  stat.innerHTML='<span style="color:var(--blue)">시세 조회 중...</span>';

  let tqqqPx, qqqmPx, usdkrw;
  const today = new Date().toISOString().slice(0,10);
  if (date >= today && _rd) {
    // 오늘 이후 날짜(주말 포함)는 최신 시세 그대로 사용
    ({ tqqqPx, qqqmPx, usdkrw } = _rd);
  } else {
    [tqqqPx, qqqmPx, usdkrw] = await Promise.all([
      fetchPriceOnDate('TQQQ', date),
      fetchPriceOnDate('QQQM', date),
      fetchPriceOnDate('USDKRW=X', date),
    ]);
    // 비영업일(주말·공휴일)이면 최신 시세로 폴백
    if ((!tqqqPx || !qqqmPx || !usdkrw) && _rd) {
      ({ tqqqPx, qqqmPx, usdkrw } = _rd);
      toast('⚠ 해당 날짜 시세 없음(비영업일) — 최신 시세로 저장');
    }
  }
  if (!tqqqPx || !qqqmPx || !usdkrw) {
    stat.innerHTML='<span style="color:var(--red)">시세 조회 실패 — 새로고침 후 다시 시도하세요</span>';
    return;
  }

  const totalUsd = tqqq*tqqqPx + qqqm*qqqmPx + usd;
  const totalKrw = totalUsd * usdkrw;
  const entry    = { date, tqqq, qqqm, usd, tqqqPx, qqqmPx, usdkrw, totalUsd, totalKrw };

  const snaps = loadSnaps();
  const idx = snaps.findIndex(s => s.date === date);
  if (idx >= 0) snaps[idx] = entry; else snaps.push(entry);
  snaps.sort((a,b) => a.date.localeCompare(b.date));
  saveSnaps(snaps);

  const krwFmt = Math.round(totalKrw/10000).toLocaleString('ko-KR');
  stat.innerHTML=`<span style="color:var(--green)">✓ 저장 완료 — 총 ₩${krwFmt}만 ($${Math.round(totalUsd).toLocaleString()})</span>`;
  renderWealthChart();
  renderSnapList();
  writeToICloud(snaps).then(ok => {
    if (ok) stat.innerHTML += ' &nbsp;<span style="color:#60a5fa;font-size:11px">☁️ iCloud 저장됨</span>';
    else downloadSnaps(snaps);
  });
}

function deleteSnap(date) {
  if (!confirm(`${date} 기록을 삭제할까요?`)) return;
  saveSnaps(loadSnaps().filter(s=>s.date!==date));
  renderWealthChart(); renderSnapList();
  if (_rd) { renderRebalTable(); updateRebalRec(); }
}

// ── Charts ────────────────────────────────────────────────────────────────────
function renderWealthChart() {
  const snaps = loadSnaps();
  const el = document.getElementById('wealth-chart');
  if (!snaps.length) {
    el.style.height='72px';
    el.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:72px;color:var(--muted);font-size:13px">보유 현황을 입력하면 자산 변화 그래프가 표시됩니다</div>';
    return;
  }
  el.style.height='290px'; el.innerHTML='';
  const dates=snaps.map(s=>s.date), krwMan=snaps.map(s=>+(s.totalKrw/10000).toFixed(0)), usdVals=snaps.map(s=>+s.totalUsd.toFixed(0));
  const mode=snaps.length>1?'lines+markers':'markers';
  Plotly.newPlot(el,[
    {type:'scatter',mode,name:'KRW (만원)',x:dates,y:krwMan,
     line:{color:'#22c55e',width:2},marker:{color:'#22c55e',size:8},yaxis:'y',
     hovertemplate:'%{x}<br>₩<b>%{y:,}만원</b><extra></extra>'},
    {type:'scatter',mode,name:'USD ($)',x:dates,y:usdVals,
     line:{color:'#3b82f6',width:2,dash:'dot'},marker:{color:'#3b82f6',size:7,symbol:'diamond'},yaxis:'y2',
     hovertemplate:'%{x}<br>$<b>%{y:,}</b><extra></extra>'},
  ],{
    paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{color:'#d8dce8',size:11},
    margin:{t:16,b:40,l:72,r:72},
    xaxis:{gridcolor:'#2a2d3e',linecolor:'#2a2d3e',type:'date'},
    yaxis:{gridcolor:'#2a2d3e',linecolor:'#2a2d3e',title:{text:'만원',font:{size:10}},tickformat:','},
    yaxis2:{gridcolor:'transparent',linecolor:'#2a2d3e',overlaying:'y',side:'right',
            title:{text:'USD $',font:{size:10}},tickformat:',.0f'},
    legend:{x:0.01,y:1.12,orientation:'h',bgcolor:'rgba(0,0,0,0)',font:{size:11}},
    hovermode:'x unified',height:290,
  },{responsive:true,displayModeBar:false});
}

function renderSnapList() {
  const snaps = loadSnaps();
  const el = document.getElementById('snap-list');
  if (!snaps.length) { el.innerHTML=''; return; }
  el.innerHTML=
    `<div style="font-size:11px;color:var(--muted);margin:14px 0 6px">입력 기록 (최신 순)</div>
     <div class="tbl-wrap"><table>
       <thead><tr>
         <th>날짜</th><th>TQQQ</th><th>QQQM</th><th>USD($)</th>
         <th>TQQQ가</th><th>QQQM가</th><th>환율</th><th>총 USD</th><th>총 KRW</th><th></th>
       </tr></thead>
       <tbody>${[...snaps].reverse().map(s=>{
         const krw=Math.round(s.totalKrw/10000).toLocaleString('ko-KR');
         return `<tr>
           <td><b>${s.date}</b></td>
           <td>${s.tqqq}주</td><td>${s.qqqm}주</td><td>$${s.usd.toFixed(0)}</td>
           <td style="color:var(--muted)">$${s.tqqqPx.toFixed(2)}</td>
           <td style="color:var(--muted)">$${s.qqqmPx.toFixed(2)}</td>
           <td style="color:var(--muted)">${s.usdkrw.toFixed(1)}</td>
           <td class="pos">$${Math.round(s.totalUsd).toLocaleString()}</td>
           <td class="pos">₩${krw}만</td>
           <td><button onclick="deleteSnap('${s.date}')"
                 style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:17px;padding:0 4px"
                 title="삭제">×</button></td>
         </tr>`;}).join('')}
       </tbody></table></div>`;
}

// ── iCloud Drive ──────────────────────────────────────────────────────────────
function _idbOpen() {
  return new Promise((res,rej) => {
    const r=indexedDB.open('pf-icloud',1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore('h');
    r.onsuccess=e=>res(e.target.result); r.onerror=()=>rej(r.error);
  });
}
async function _idbSet(v) {
  const db=await _idbOpen();
  return new Promise((res,rej)=>{const tx=db.transaction('h','readwrite');tx.objectStore('h').put(v,'dir');tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});
}
async function _idbGet() {
  try {
    const db=await _idbOpen();
    return new Promise(res=>{const r=db.transaction('h','readonly').objectStore('h').get('dir');r.onsuccess=()=>res(r.result??null);r.onerror=()=>res(null);});
  } catch { return null; }
}
async function connectICloud() {
  if (!window.showDirectoryPicker) { toast('Chrome에서만 지원됩니다'); return; }
  try {
    const dir=await window.showDirectoryPicker({mode:'readwrite'});
    await _idbSet(dir); toast('✓ iCloud Drive 연결 완료'); _refreshICloudStatus(dir);
  } catch(e) { if(e.name!=='AbortError') toast('연결 실패: '+e.message); }
}
async function _refreshICloudStatus(handle) {
  const el=document.getElementById('icloud-status'); if(!el) return;
  if(!handle) handle=await _idbGet();
  if(!handle){el.innerHTML='<span style="color:var(--muted)">미연결</span>';return;}
  const perm=await handle.queryPermission({mode:'readwrite'});
  el.innerHTML=perm==='granted'?`<span style="color:var(--green)">● ${handle.name}</span>`:`<span style="color:#f97316">● ${handle.name} (권한 필요)</span>`;
}
async function writeToICloud(snaps) {
  const dir=await _idbGet(); if(!dir) return false;
  try {
    const perm=await dir.queryPermission({mode:'readwrite'});
    if(perm!=='granted'&&await dir.requestPermission({mode:'readwrite'})!=='granted') return false;
    const fh=await dir.getFileHandle('pf_snaps.json',{create:true});
    const wr=await fh.createWritable();
    await wr.write(JSON.stringify(snaps,null,2)); await wr.close(); return true;
  } catch { return false; }
}

// ── Refresh ───────────────────────────────────────────────────────────────────
async function refresh() {
  document.getElementById('last-update').textContent = '데이터 로딩 중...';
  const [qqqmCloses, tqqqCloses, usdkrwCloses, vixCloses] = await Promise.all([
    fetchCloses('QQQM','1y'),
    fetchCloses('TQQQ','5d'),
    fetchCloses('USDKRW=X','5d'),
    fetchCloses('^VIX','5d'),
  ]);
  initRebal(tqqqCloses.at(-1), qqqmCloses.at(-1), usdkrwCloses.at(-1), qqqmCloses, vixCloses.at(-1));
  document.getElementById('last-update').textContent =
    `마지막 업데이트: ${new Date().toLocaleString('ko-KR')}`;
}

// ── Init ──────────────────────────────────────────────────────────────────────
if (window.showDirectoryPicker) document.getElementById('icloud-connect-btn').style.display='';
_refreshICloudStatus();
syncSnapsFromGitHub();
refresh();
</script>
